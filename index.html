<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeng Peichen's Personal Homepage</title>
    <style>
        /* 全局重置与基础字体 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #fafafa;
            color: #222;
            line-height: 1.6;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 820px;
            margin: 0 auto;
            background: #fff;
            padding: 2.5rem 3rem;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.05);
        }

        /* ---------- 导航栏 ---------- */
        nav {
            border-bottom: 1px solid #eaeef2;
            padding-bottom: 1rem;
            margin-bottom: 2rem;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
        }

        nav ul li {
            font-size: 1rem;
            font-weight: 500;
            color: #555;
            cursor: default;
            letter-spacing: 0.3px;
        }

        nav ul li:first-child {
            color: #0366d6;      /* 高亮当前页 “Home” */
            font-weight: 600;
        }

        /* ---------- 主体内容 ---------- */
        h1 {
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
            letter-spacing: -0.3px;
        }

        .subhead {
            font-size: 1rem;
            color: #555;
            margin-bottom: 0.1rem;
        }

        .location {
            font-size: 0.95rem;
            color: #777;
            margin-bottom: 1.8rem;
        }

        /* CV 大标题 */
        .section-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin: 2rem 0 1.2rem 0;
            letter-spacing: -0.2px;
        }

        /* 教育条目 */
        .edu-item {
            margin-bottom: 1.8rem;
        }

        .edu-item .degree {
            font-weight: 600;
            font-size: 1.05rem;
        }

        .edu-item .meta {
            color: #555;
            font-size: 0.95rem;
        }

        .edu-item .date {
            color: #777;
            font-size: 0.9rem;
            display: block;
            margin-top: 0.1rem;
        }

        /* Awards 部分 */
        .awards-section {
            margin-top: 2rem;
        }

        .awards-section .label {
            font-weight: 600;
            font-size: 1.05rem;
            margin-bottom: 0.2rem;
        }

        .awards-section .award-item {
            color: #333;
            font-size: 0.95rem;
        }

        /* 辅助分割线（可选） */
        hr {
            border: none;
            border-top: 1px solid #eaeef2;
            margin: 1.8rem 0;
        }

        /* 小屏适配 */
        @media (max-width: 600px) {
            .container {
                padding: 1.8rem 1.2rem;
            }
            nav ul {
                gap: 1.2rem;
            }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- 导航栏 -->
    <nav>
        <ul>
            <li>Home</li>
            <li>CV</li>
            <li>Publications</li>
            <li>Blogs</li>
        </ul>
    </nav>

    <!-- 个人信息 -->
    <h1>Peichen Zeng</h1>
    <div class="subhead">An undergraduate student</div>
    <div class="location">China</div>

    <!-- CV 区块 -->
    <div class="section-title">CV</div>

    <!-- 教育经历 -->
    <div class="edu-item">
        <div class="degree">B.S. in Computer Science and Technology (2024–Present)</div>
        <div class="meta">Peichen Zeng</div>
        <div class="date">2024 – 2028 (expected)</div>
    </div>

    <!-- Awards 部分（根据图片中的 “Awards” 标签） -->
    <div class="awards-section">
        <div class="label">Awards</div>
        <div class="award-item">123123</div>
        <!-- 你可以继续添加更多奖项 -->
    </div>

    <!-- 底部占位（可选） -->
    <hr>
    <p style="font-size: 0.85rem; color: #aaa; text-align: right;">Last updated: 2026</p>

</div>

</body>
</html>
